name: CI

on:
  push:
  pull_request:
  schedule:
    # Weekly, so a broken dependency or toolchain shows up as a red check
    # (and an email) long before it is discovered at a demo.
    - cron: "0 7 * * 1"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
