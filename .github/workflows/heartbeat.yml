name: Heartbeat

# A second, independent keepalive besides the daily Vercel cron: /api/health runs
# a real `select 1`, which stops the free-tier Supabase project pausing. It also
# fails loudly (email from GitHub) if the deployed app or database is unhealthy.
# Note: GitHub disables scheduled workflows on a public repo after 60 days with no
# repository activity, so the Vercel cron remains the primary line.
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/health
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::notice::APP_URL is not set, so this heartbeat is NOT checking anything. Set the repository variable APP_URL (e.g. https://enagram-io.vercel.app) to enable it."
            exit 0
          fi
          curl --fail --silent --show-error --retry 2 --retry-delay 10 --max-time 60 "${APP_URL%/}/api/health"
